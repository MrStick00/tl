<script>
const viewer = document.getElementById("viewer");
const file = document.getElementById("file");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const status = document.getElementById("status");
const lastHeard = document.getElementById("lastHeard");

let words = [];
let index = 0;
let recognition;
let listening = false;

// ---------------- NORMALIZAÇÃO ----------------
const normalize = s =>
  s.toLowerCase()
   .normalize("NFD")
   .replace(/[\u0300-\u036f]/g, "")
   .replace(/[.,!?;:()"']/g, "")
   .trim();

// ---------------- RENDER ----------------
function render(text){
  viewer.innerHTML = "";
  words = text.split(/\s+/);
  index = 0;

  words.forEach((w,i)=>{
    const span=document.createElement("span");
    span.textContent=w+" ";
    span.id="w"+i;
    viewer.appendChild(span);
  });

  highlight();
}

function highlight(){
  words.forEach((_,i)=>{
    const el=document.getElementById("w"+i);
    el.style.color = i < index ? "#3ddc84" : "#e7eef7";
    el.style.background = i===index ? "rgba(255,209,102,.25)" : "transparent";
  });

  const current=document.getElementById("w"+index);
  if(current) current.scrollIntoView({behavior:"smooth",block:"center"});
}

// ---------------- MATCHER (NOVO) ----------------
function tryAdvance(transcript){

  const spoken = normalize(transcript).split(" ").filter(Boolean);
  if(spoken.length < 2) return;

  // apenas olha 8 palavras à frente
  const lookAhead = 8;

  for(let offset=0; offset<lookAhead; offset++){

    const a = words[index+offset];
    const b = words[index+offset+1];
    if(!a || !b) break;

    const targetPair = normalize(a+" "+b);

    for(let i=0;i<spoken.length-1;i++){
      const spokenPair = spoken[i]+" "+spoken[i+1];

      // match aproximado
      if(similar(spokenPair,targetPair)){
        index += offset+2;
        highlight();
        return;
      }
    }
  }
}

// ---------------- SIMILARIDADE ----------------
function similar(a,b){
  if(a===b) return true;

  // tolerância para erros pequenos
  let score=0;
  const aw=a.split(" ");
  const bw=b.split(" ");

  for(let i=0;i<Math.min(aw.length,bw.length);i++){
    if(aw[i].startsWith(bw[i].slice(0,3))) score++;
  }

  return score>=1;
}

// ---------------- SPEECH ----------------
function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang="pt-BR";
  recognition.continuous=true;
  recognition.interimResults=false;

  recognition.onresult=(e)=>{
    const res=e.results[e.results.length-1][0].transcript;
    lastHeard.textContent="Ouvido: "+res;
    tryAdvance(res);
  };

  recognition.onend=()=>{
    if(listening){
      try{recognition.start();}catch{}
    }
  };

  recognition.onerror=(e)=>{
    status.textContent="Erro: "+e.error;
  };

  recognition.start();
}

// ---------------- CONTROLOS ----------------
file.onchange=async e=>{
  const txt=await e.target.files[0].text();
  render(txt);
  status.textContent="Guião carregado";
};

startBtn.onclick=()=>{
  listening=true;
  startRecognition();
  status.textContent="A ouvir...";
};

stopBtn.onclick=()=>{
  listening=false;
  recognition.stop();
  status.textContent="Parado";
};
</script>
